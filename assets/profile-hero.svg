<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Manas Bhasker — StillnWater</title>
  <desc id="desc">A dark purple developer profile banner with an avatar, magenta accents, and a short introduction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21052f"/>
      <stop offset=".55" stop-color="#14001f"/>
      <stop offset="1" stop-color="#090817"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a21caf"/>
      <stop offset=".55" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f0abfc"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#c084fc" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <clipPath id="avatarClip"><circle cx="142" cy="145" r="62"/></clipPath>
  </defs>

  <rect x="9" y="9" width="1182" height="282" rx="27" fill="url(#bg)" stroke="#762a91" stroke-width="1.5"/>
  <rect x="10" y="10" width="1180" height="280" rx="26" fill="url(#grid)"/>
  <path d="M20 235C180 145 260 285 430 195S720 90 880 165 1085 205 1180 110" fill="none" stroke="#a855f7" stroke-opacity=".17" stroke-width="2"/>
  <circle cx="1060" cy="82" r="112" fill="none" stroke="#a855f7" stroke-opacity=".16" stroke-width="1.5"/>
  <circle cx="1060" cy="82" r="78" fill="none" stroke="#22d3ee" stroke-opacity=".12" stroke-width="1.5"/>
  <circle cx="1145" cy="220" r="5" fill="#e879f9"/>
  <circle cx="1012" cy="38" r="3" fill="#67e8f9"/>
  <circle cx="930" cy="250" r="3" fill="#c084fc"/>

  <circle cx="142" cy="145" r="73" fill="#180b27" stroke="#c026d3" stroke-width="3"/>
  <circle cx="142" cy="145" r="67" fill="none" stroke="#67e8f9" stroke-opacity=".6" stroke-width="1.5"/>
  <circle cx="142" cy="145" r="62" fill="#241137"/>
  <text x="142" y="157" fill="#f5d0fe" font-family="Arial,Helvetica,sans-serif" font-size="35" font-weight="700" text-anchor="middle" letter-spacing="2">SW</text>
  <image x="80" y="83" width="124" height="124" xlink:href="https://github.com/StillnWater.png?size=256" clip-path="url(#avatarClip)" preserveAspectRatio="xMidYMid slice"/>

  <text x="252" y="91" fill="#d8b4fe" font-family="Courier New,monospace" font-size="20" letter-spacing="4">@stillnwater</text>
  <text x="248" y="151" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" font-size="49" font-weight="800" letter-spacing="1">MANAS BHASKER</text>
  <rect x="251" y="170" width="64" height="3" rx="2" fill="url(#edge)"/>
  <text x="251" y="205" fill="#e9d5ff" font-family="Arial,Helvetica,sans-serif" font-size="19">Full Stack Developer  <tspan fill="#c084fc">•</tspan>  Creative Builder</text>

  <g font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600">
    <rect x="251" y="229" width="130" height="34" rx="17" fill="#251035" stroke="#8b3ca7"/>
    <text x="316" y="251" fill="#f0abfc" text-anchor="middle">JavaScript</text>
    <rect x="393" y="229" width="130" height="34" rx="17" fill="#251035" stroke="#8b3ca7"/>
    <text x="458" y="251" fill="#f0abfc" text-anchor="middle">TypeScript</text>
    <rect x="535" y="229" width="112" height="34" rx="17" fill="#251035" stroke="#8b3ca7"/>
    <text x="591" y="251" fill="#f0abfc" text-anchor="middle">Python</text>
  </g>
  <text x="1150" y="273" fill="#8b5ca4" font-family="Courier New,monospace" font-size="11" text-anchor="end">STILLNWATER / PROFILE</text>
</svg>